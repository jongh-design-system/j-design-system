name: Prepare Release PR
description: Create or update the Release PR from Changesets on dev

inputs:
  github-token:
    description: GitHub token used to create or update the Release PR
    required: true

runs:
  using: composite
  steps:
    - name: Read the pending Changesets from dev
      id: pending
      shell: bash
      run: |
        git fetch origin dev
        git checkout --detach origin/dev
        if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit | grep -q .; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Prepare and push the Release PR branch
      if: steps.pending.outputs.present == 'true'
      id: release
      shell: bash
      env:
        BRANCH: release/npm
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        pnpm run ci:version
        git add -A
        git commit -m "Prepare npm release"

        REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
        git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" origin "HEAD:refs/heads/$BRANCH"
        echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

    - name: Open or update the Release PR
      if: steps.pending.outputs.present == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ steps.release.outputs.branch }}
      run: |
        OPEN_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')"
        if [ -n "$OPEN_PR" ]; then
          exit 0
        fi

        gh pr create \
          --repo "$GITHUB_REPOSITORY" \
          --head "$BRANCH" \
          --base dev \
          --title "Release npm packages" \
          --body "Publishes the package changes recorded on dev."
