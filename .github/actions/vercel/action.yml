name: "Vercel Deploy"
description: "Placeholder action wiring GitHub workflow inputs for Vercel deployment."
inputs:
  vercel-token:
    description: "Vercel access token."
    required: true
  github-token:
    description: "GitHub token used for API calls."
    required: true
  vercel-org-id:
    description: "Vercel organization identifier."
    required: true
  vercel-project-id:
    description: "Vercel project identifier."
    required: true
  vercel-args:
    description: "Arguments passed to the Vercel CLI."
    required: false
    default: "--prod"
  workingDir:
    description: "Working directory passed through the workflow."
    required: true
outputs:
  preview-url:
    description: "Resolved Vercel deployment URL."
    value: ${{ steps.deploy.outputs.preview-url }}
  preview-name:
    description: "Resolved Vercel deployment name."
    value: ${{ steps.deploy.outputs.preview-name }}
runs:
  using: composite
  steps:
    - name: Run Vercel deploy
      id: deploy
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        ACTION_GITHUB_TOKEN: ${{ inputs.github-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        VERCEL_ARGS: ${{ inputs.vercel-args }}
        WORKING_DIR: ${{ inputs.workingDir }}
      run: node "$GITHUB_ACTION_PATH/index.js"
branding:
  icon: "triangle"
  color: "blue"
