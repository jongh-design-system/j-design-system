name: "Vercel Deploy"
description: "Placeholder action wiring GitHub workflow inputs for Vercel deployment."
inputs:
  vercel-token:
    description: "Vercel access token."
    required: true
  github-token:
    description: "GitHub token used for API calls."
    required: true
  vercel-org-id:
    description: "Vercel organization identifier."
    required: true
  vercel-project-id:
    description: "Vercel project identifier."
    required: true
  vercel-args:
    description: "Arguments passed to the Vercel CLI."
    required: false
    default: "--prod"
  workingDir:
    description: "Optional working directory passed through the workflow."
    required: false
runs:
  using: "node20"
  main: "index.js"
branding:
  icon: "triangle"
  color: "blue"
