name: playwright-install

runs:
  using: composite

  steps:
    - name: Get playwright version
      shell: bash
      run: |
        PLAYWRIGHT_VERSION="$(pnpm --filter @jongh/ui exec node -p "require('playwright/package.json').version")"
        echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"
      id: playwright-version

    - name: Cache Playwright Browsers for Playwright's Version
      uses: actions/cache@v5
      with:
        # https://playwright.dev/docs/browsers#managing-browser-binaries
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-playwright-
      id: cache-playwright-browsers

    - name: Setup Playwright
      shell: bash
      if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
      run: pnpm --filter @jongh/ui exec playwright install --with-deps
