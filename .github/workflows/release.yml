name: npm release

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  id-token: write
  pull-requests: read

concurrency:
  group: npm-release-dev
  cancel-in-progress: false

env:
  CI: true
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check whether the pushed commit merged a Release PR
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_PR="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
              jq -r --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
                '[.[] | select(.base.ref == "dev" and (.head.ref | startswith("release/")) and .head.repo.full_name == $repo and .merge_commit_sha == $sha and .merged_at != null)] | first | .number // empty'
          )"
          if [ -n "$RELEASE_PR" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.source.outputs.should_publish == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up the workspace
        if: steps.source.outputs.should_publish == 'true'
        uses: ./.github/actions/setup
        with:
          use-cache: "false"

      - name: Configure npm trusted publishing
        if: steps.source.outputs.should_publish == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build publishable packages
        if: steps.source.outputs.should_publish == 'true'
        run: pnpm turbo build

      - name: Publish the approved versions
        if: steps.source.outputs.should_publish == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm ci:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
