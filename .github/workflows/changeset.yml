name: Release PR

on:
  push:
    branches:
      - dev
    paths:
      - ".changeset/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-release-dev
  cancel-in-progress: false

env:
  CI: true
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          use-cache: "false"

      - name: Maintain the reviewed Release PR
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          commit: Prepare the reviewed date-based npm release
          title: Prepare the reviewed date-based npm release
        env:
          GITHUB_TOKEN: ${{ github.token }}
