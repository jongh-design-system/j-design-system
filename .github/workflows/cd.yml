name: Build & Deploy Docs
permissions:
  id-token: write
  contents: read
on:
  push:
    branches:
      - dev
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup pnpm
        uses: ./.github/actions/setup

      - name: build
        run: pnpm turbo build

      - name: Check Build Outputs (Concise)
        shell: bash
        run: |
          echo "=== Checking packages/ui/storybook-static ==="
          ls -Rla packages/ui/storybook-static | head -n 30 || echo "Error: Directory 'packages/ui/storybook-static' not found or problem listing files."
          echo ""
          echo "=== Checking app/docs/out ==="
          ls -Rla app/docs/out | head -n 30 || echo "Error: Directory 'app/docs/out' not found or problem listing files."
          echo "=== End of Checks ==="

      - name: Upload Storybook artifact for Chromatic
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifact
          path: packages/ui/storybook-static

      - name: Upload Docs artifact for AWS
        uses: actions/upload-artifact@v4
        with:
          name: docs-artifact
          path: app/docs/out

  deploy-ui:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup pnpm
        uses: ./.github/actions/setup

      - name: Download Chromatic artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-artifact
          path: packages/ui/storybook-static

      - name: deploy storybook using chromatic
        uses: ./.github/actions/chromatic
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          workingDir: packages/ui
          storybookBuildDir: storybook-static

  deploy-docs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup pnpm
        uses: ./.github/actions/setup

      - name: Download AWS Docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-artifact
          path: app/docs/out

      - name: deploy docs to AWS S3 + Cloudfront
        uses: ./.github/actions/aws
        with:
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws_region: ${{ secrets.AWS_REGION }}
          aws_s3_bucket_name: ${{ secrets.AWS_S3_BUCKET_NAME }}
          aws_cloudfront_id: ${{ secrets.AWS_CLOUDFRONT_ID }}

      - name: cache playwright
        uses: ./.github/actions/playwright
